<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Video Maker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: #ffffff;
    }

    .container {
      max-width: 620px;
      margin: auto;
      padding: 25px 18px 40px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-weight: bold;
    }

    textarea,
    select {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #17171d;
      color: white;
      font-size: 15px;
      outline: none;
    }

    textarea {
      min-height: 145px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #6c5ce7;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result {
      margin-top: 25px;
      padding: 18px;
      border-radius: 15px;
      background: #15151b;
      display: none;
    }

    .status {
      color: #aaa;
      margin-top: 10px;
      line-height: 1.5;
      word-break: break-word;
    }

    video {
      width: 100%;
      margin-top: 18px;
      border-radius: 12px;
      background: #000;
    }

    #downloadBtn {
      display: none;
      text-decoration: none;
    }

    #downloadBtn button {
      background: #00a884;
    }

    .note {
      color: #777;
      font-size: 12px;
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎬 AI Video Maker</h1>

    <div class="subtitle">
      Turn your idea into an AI video
    </div>

    <label for="prompt">Video Prompt</label>

    <textarea
      id="prompt"
      placeholder="Example: A cinematic sunset over a beautiful mountain lake..."
    ></textarea>


    <label for="duration">Duration</label>

    <select id="duration">
      <option value="5">5 Seconds</option>
      <option value="10">10 Seconds</option>
      <option value="15">15 Seconds</option>
    </select>


    <label for="ratio">Aspect Ratio</label>

    <select id="ratio">
      <option value="9:16">9:16 — Reels / Shorts</option>
      <option value="16:9">16:9 — YouTube</option>
      <option value="1:1">1:1 — Square</option>
    </select>


    <button id="generateBtn">
      🚀 Generate Video
    </button>


    <div class="result" id="result">

      <h3>Generation Status</h3>

      <div class="status" id="status">
        Waiting...
      </div>


      <video
        id="video"
        controls
        playsinline
        style="display:none;"
      ></video>


      <a
        id="downloadBtn"
        target="_blank"
        rel="noopener"
      >
        <button type="button">
          ⬇️ Open / Download Video
        </button>
      </a>

    </div>


    <div class="note">
      AI video generation can take some time.
    </div>

  </div>


  <script>

    /* =====================================
       CLOUDFLARE WORKER URL
       ===================================== */

    const WORKER_URL =
      "https://ai-video-backend.nikunjkanani8980.workers.dev";


    /* =====================================
       ELEMENTS
       ===================================== */

    const promptInput =
      document.getElementById("prompt");

    const durationInput =
      document.getElementById("duration");

    const ratioInput =
      document.getElementById("ratio");

    const generateBtn =
      document.getElementById("generateBtn");

    const resultBox =
      document.getElementById("result");

    const statusBox =
      document.getElementById("status");

    const video =
      document.getElementById("video");

    const downloadBtn =
      document.getElementById("downloadBtn");


    /* =====================================
       GENERATE VIDEO
       ===================================== */

    generateBtn.addEventListener(
      "click",
      generateVideo
    );


    async function generateVideo() {

      const prompt =
        promptInput.value.trim();

      const duration =
        Number(durationInput.value);

      const ratio =
        ratioInput.value;


      /* CHECK PROMPT */

      if (!prompt) {

        alert(
          "Please enter a video prompt."
        );

        promptInput.focus();

        return;
      }


      /* SHOW RESULT */

      resultBox.style.display =
        "block";


      /* RESET OLD VIDEO */

      video.pause();

      video.removeAttribute("src");

      video.load();

      video.style.display =
        "none";


      downloadBtn.style.display =
        "none";

      downloadBtn.removeAttribute(
        "href"
      );


      /* LOADING */

      generateBtn.disabled =
        true;

      generateBtn.innerText =
        "⏳ Generating...";


      statusBox.innerText =
        "Sending your request to the AI video generator...";


      try {

        /* SEND REQUEST TO CLOUDFLARE */

        const response =
          await fetch(
            WORKER_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                prompt: prompt,

                duration: duration,

                ratio: ratio

              })
            }
          );


        /* READ RESPONSE */

        const data =
          await response.json();


        /* CHECK SERVER ERROR */

        if (!response.ok) {

          throw new Error(
            data.error ||
            "Server error: " +
            response.status
          );

        }


        /* CHECK AI ERROR */

        if (!data.success) {

          throw new Error(
            data.error ||
            "Video generation failed."
          );

        }


        /* CHECK VIDEO */

        if (!data.video) {

          throw new Error(
            "AI did not return a video URL."
          );

        }


        /* SUCCESS */

        statusBox.innerText =
          "✅ Video generated successfully!";


        video.src =
          data.video;

        video.style.display =
          "block";


        downloadBtn.href =
          data.video;

        downloadBtn.style.display =
          "block";


      } catch (error) {

        console.error(
          "AI VIDEO ERROR:",
          error
        );


        statusBox.innerText =
          "❌ " +
          (
            error.message ||
            "Something went wrong."
          );

      } finally {

        generateBtn.disabled =
          false;

        generateBtn.innerText =
          "🚀 Generate Video";

      }

    }

  </script>

</body>
</html>
