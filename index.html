<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Video Maker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 25px 18px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 8px;
      font-weight: bold;
    }

    textarea,
    select {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #17171d;
      color: white;
      font-size: 15px;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #6c5ce7;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .result {
      margin-top: 25px;
      padding: 18px;
      border-radius: 15px;
      background: #15151b;
      display: none;
    }

    .status {
      color: #aaa;
      margin-top: 10px;
      line-height: 1.5;
    }

    video {
      width: 100%;
      border-radius: 12px;
      margin-top: 15px;
      background: black;
    }

    .download {
      display: none;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎬 AI Video Maker</h1>

    <div class="subtitle">
      Turn your idea into an AI video
    </div>

    <label>Video Prompt</label>

    <textarea
      id="prompt"
      placeholder="Example: A beautiful girl walking through a futuristic city at night..."
    ></textarea>

    <label>Duration</label>

    <select id="duration">
      <option value="5">5 Seconds</option>
      <option value="10">10 Seconds</option>
      <option value="15">15 Seconds</option>
    </select>

    <label>Aspect Ratio</label>

    <select id="ratio">
      <option value="9:16">9:16 — Reels / Shorts</option>
      <option value="16:9">16:9 — YouTube</option>
      <option value="1:1">1:1 — Square</option>
    </select>

    <button id="generateBtn" onclick="generateVideo()">
      🚀 Generate Video
    </button>

    <div class="result" id="result">

      <h3>Generation Status</h3>

      <div class="status" id="status">
        Waiting...
      </div>

      <video
        id="video"
        controls
        style="display:none;"
      ></video>

      <a
        id="downloadBtn"
        class="download"
        target="_blank"
      >
        <button type="button">
          ⬇️ Open / Download Video
        </button>
      </a>

    </div>

  </div>
